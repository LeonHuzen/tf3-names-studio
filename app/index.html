<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Names Studio</title>
<style>
:root {
	--bg: #f6f5f1; --surface: #ffffff; --surface-2: #f0eee8; --border: #dcd8cd;
	--text: #22211d; --muted: #6b675d; --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #fde9dd;
	--ok: #15803d; --warn: #a16207; --err: #b91c1c; --chip: #ece9e0; --focus: #2563eb;
	--radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #17160f; --surface: #211f17; --surface-2: #2a271d; --border: #3a3628;
		--text: #eceae0; --muted: #a09a88; --accent: #f97316; --accent-ink: #1a0e03; --accent-soft: #3a2412;
		--ok: #4ade80; --warn: #facc15; --err: #f87171; --chip: #2f2b1f; --focus: #60a5fa; --shadow: none;
	}
}
:root[data-theme="dark"] {
	--bg: #17160f; --surface: #211f17; --surface-2: #2a271d; --border: #3a3628;
	--text: #eceae0; --muted: #a09a88; --accent: #f97316; --accent-ink: #1a0e03; --accent-soft: #3a2412;
	--ok: #4ade80; --warn: #facc15; --err: #f87171; --chip: #2f2b1f; --focus: #60a5fa; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; font: inherit; color: var(--muted); cursor: pointer; }
nav button:hover { background: var(--surface-2); color: var(--text); }
nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
#saved { font-size: 12px; color: var(--muted); }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
h3 { margin: 0 0 8px; font-size: 15px; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: 250px 1fr; gap: 16px; align-items: start; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
label.f > span { display: block; margin-bottom: 3px; }
input[type=text], input[type=number], select, textarea {
	width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
	border-radius: 8px; padding: 7px 9px;
}
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.45; resize: vertical; }
input[type=number] { width: 90px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
button.b { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button.b:hover { background: var(--surface-2); }
button.b.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.b.primary:hover { filter: brightness(1.08); }
button.b.danger { color: var(--err); }
button.b.small { padding: 3px 9px; font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.sp { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.themes { display: flex; flex-direction: column; gap: 4px; }
.theme-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--text); font: inherit; cursor: pointer; }
.theme-btn:hover { background: var(--surface-2); }
.theme-btn[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.theme-btn .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.theme-btn.off { opacity: .5; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.off .dot { background: var(--border); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 3px 11px; font-size: 13px; }
button.chip { cursor: pointer; color: var(--text); font-family: inherit; }
button.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
button.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.invent { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.invent h4 { margin: 0 0 8px; font-size: 13px; }
.count { font-size: 12px; color: var(--muted); }
.rule { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--border); }
.rule:first-child { border-top: 0; }
.rule .num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.rule.off { opacity: .5; }
.rule .inline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; }
.rule .inline input[type=number] { width: 78px; }
.rule .inline select { width: auto; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 4px 6px 4px 0; text-align: left; vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
.issue { padding: 7px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
.issue.error { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); }
.issue.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.issue.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; white-space: pre-wrap; word-break: break-all; }
.result { font-size: 16px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
footer a { color: var(--accent); }
.coffee { display: inline-block; padding: 6px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink) !important; text-decoration: none; font-weight: 600; }
.coffee:hover { filter: brightness(1.08); }
#banner { background: var(--accent-soft); color: var(--text); border-bottom: 1px solid var(--border); }
#banner .in { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; font-size: 14px; }
#banner .in span { flex: 1; min-width: 200px; }
#banner a.coffee { padding: 4px 12px; }
#banner button { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; padding: 2px 8px; border-radius: 6px; cursor: pointer; }
#banner button:hover { background: var(--surface-2); color: var(--text); }
dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); padding: 22px 24px; max-width: 440px; width: calc(100% - 32px); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h3 { margin: 0 0 6px; font-size: 18px; }
dialog p { margin: 0 0 14px; color: var(--muted); }
dialog .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
dialog .never { margin-top: 14px; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div id="banner" hidden>
	<div class="in">
		<span>☕ Names Studio is free and open source. If it's useful to you, you can support its development.</span>
		<a class="coffee" href="https://www.buymeacoffee.com/huuz" target="_blank" rel="noopener">Buy me a coffee</a>
		<button type="button" id="banner-close" aria-label="Dismiss banner">×</button>
	</div>
</div>
<header>
	<div class="bar">
		<div class="brand">Names Studio <small>for Transport Fever 3</small></div>
		<nav id="nav" aria-label="Sections"></nav>
		<span id="saved" aria-live="polite"></span>
	</div>
</header>
<main id="view"></main>
<footer>
	<span>Free &amp; open source (MIT) · <a href="https://github.com/LeonHuzen/tf3-names-studio" target="_blank" rel="noopener">GitHub</a> · Not affiliated with Urban Games</span>
	<a class="coffee" href="https://www.buymeacoffee.com/huuz" target="_blank" rel="noopener">☕ Buy me a coffee</a>
</footer>
<dialog id="thanks" aria-labelledby="thanks-title"></dialog>
<div id="toast" role="status"></div>
<script src="defaults.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
